# ---------------------------------------------------------------------------
# standalone profile
#   - Own H2 in-memory database (shares nothing with catalog)
#   - No security; catalog.service.url still externalised via CATALOG_SERVICE_URL
#   - Starts with zero environment variables
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
