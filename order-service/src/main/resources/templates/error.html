<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:style="|--accent: ${@podInfo.accent};|">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container page">
    <div class="error-panel">
        <div class="error-code" th:text="${status} ?: '500'">500</div>
        <h1 class="error-title" th:text="${error} ?: 'Something went wrong'">Error</h1>
        <p class="error-msg" th:if="${message}" th:text="${message}">Unexpected error.</p>
        <a class="btn btn-primary" th:href="@{/orders}">Back to orders</a>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
